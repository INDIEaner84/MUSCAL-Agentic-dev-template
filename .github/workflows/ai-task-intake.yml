name: AI Task Intake

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Stable lowercase ID, for example feature-001"
        required: true
        type: string
      title:
        description: "Short task title"
        required: true
        type: string
      workflow:
        description: "Workflow family"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - cleanup
          - feature
          - bugfix
          - refactor
          - security
      description:
        description: "Objective, expected outcome, and important constraints"
        required: true
        type: string
      max_iterations:
        description: "Optional 1-20 override; leave empty for the workflow default"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  start:
    name: Persist task and request orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TASK_ID: ${{ inputs.task_id }}
      TASK_TITLE: ${{ inputs.title }}
      TASK_WORKFLOW: ${{ inputs.workflow }}
      TASK_DESCRIPTION: ${{ inputs.description }}
      MAX_ITERATIONS: ${{ inputs.max_iterations }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Create persistent task state
        run: |
          set -euo pipefail
          args=(
            --id "$TASK_ID"
            --title "$TASK_TITLE"
            --workflow "$TASK_WORKFLOW"
            --description "$TASK_DESCRIPTION"
          )
          if [[ -n "${MAX_ITERATIONS:-}" ]]; then
            args+=(--max-iterations "$MAX_ITERATIONS")
          fi
          python3 scripts/ai/protocol.py start-task "${args[@]}"
          python3 scripts/ai/protocol.py validate
      - name: Commit task memory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/STATE.json .ai/DECISION.json .ai/CONTEXT.md .ai/TASKS/
          git commit -m "chore(ai): start task $TASK_ID"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Dispatch initial orchestrator request
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          python3 scripts/ai/protocol.py render-dispatches \
            --repository "$REPOSITORY" --ref "$DEFAULT_BRANCH" --sha "$sha" \
            > /tmp/ai-dispatches.json
          jq -c '.[]' /tmp/ai-dispatches.json | while IFS= read -r event; do
            printf '%s\n' "$event" > /tmp/ai-dispatch.json
            gh api --method POST "repos/$REPOSITORY/dispatches" --input /tmp/ai-dispatch.json
          done
